<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>LigandoPets</title>
</head>
<body>
    <div id="sidebar-container"></div>
    <main>
        <div id="header-container"></div>
        <div class="paginas">
            <div class="paginas-head">
                <span class="mini-texto">
                    Cuidado sem complicação
                </span>
                <h2>
                    Agendar uma consulta
                </h2>
                <p>
                    Conte para a gente quem precisa de cuidado.
                </p>
            </div>
            <form class="formulario-cons">
                <div class="percurso">
                    <span class="feito">
                        1
                        <small>Pet</small>
                    </span>
                    <i></i>
                    <span>
                        2
                        <small>Data</small>
                    </span>
                    <i></i>
                    <span>
                        3
                        <small>Detalhes</small>
                    </span>
                </div>
                <h3>
                    Quem vem para a consulta?
                </h3>
                <div class="escolha">
                    <label>
                        <input type="radio" checked name="pet">
                        <p class="pet-avatar dog">B</p>
                        <b>
                            Bento
                            <small>Cachorro • 4 anos</small>
                        </b>
                        <i></i>
                    </label>
                    <label>
                        <input type="radio" checked name="pet">
                        <p class="pet-avatar cat">L</p>
                        <b>
                            Lua
                            <small>Gata • 2 anos</small>
                        </b>
                        <i></i>
                    </label>
                </div>
                <button class="primario cheio" onclick="">
                    Continuar
                    <img src="../image/right-arrow.png" alt="Seta branca direita">
                </button>
            </form>
        </div>
    </main>
    <script src="../script.js"></script>
    <script>
        carregarSidebar();
        carregarHeader();
    </script>
</body>
</html>
