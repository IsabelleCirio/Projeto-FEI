<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>LigandoPets</title>
</head>
<body>
    <div id="sidebar-container"></div>
    <main>
        <div id="header-container"></div>
        <div class="paginas">
            <div class="paginas-head">
                <span class="mini-texto">SEU CARRINHO</span>
                <h2>Quase lá</h2>
                <p id="numero-carrinho">Itens escolhidos para o seu pet</p>
            </div>
            <div class="layout-carrinho">
                <div class="lista-carrinho">
                    <div class="item-carrinho">
                        <div class="foto-carrinho">
                            <img src="../image/pet-food.png" alt="Comida cachorro">
                        </div>
                        <div class="nome-carrinho">
                            <small>Cães adultos</small>
                            <b>Ração Natural Salmão</b>
                            <button onclick="removerProduto()">Remover</button>
                        </div>
                        <div class="quantidade-carrinho">
                            <button>
                                <img src="../image/plus1.png" alt="Adicionar">
                            </button>
                            <b>1</b>
                            <button>
                                <img src="../image/minus-sign.png" alt="Retirar">
                            </button>
                        </div>
                        <strong>R$ 89,90</strong>
                    </div>
                </div>
                <aside class="sumario">
                    <h3>Resumo do pedido</h3>
                    <div>
                        <span>Subtotal</span>
                        <b>R$ 89,90</b>
                    </div>
                    <div>
                        <span>Entrega</span>
                        <b>R$ 12,90</b>
                    </div>
                    <hr>
                    <div class="total">
                        <span>Total</span>
                        <b>R$ 102,80</b>
                    </div>
                    <button class="primario cheio">
                        Finalizar compra 
                        <img src="../image/right-arrow.png" alt="Seta direita">
                    </button>
                    <small>
                        <img src="../image/check.png" alt="Check">
                        Compra segura e protegida
                    </small>
                </aside>
            </div>
        </div>
    </main>
    <script src="../script.js"></script>
    <script>
        carregarSidebar();
        carregarHeader();
    </script>
</body>
</html>
