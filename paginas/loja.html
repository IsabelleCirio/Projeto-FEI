<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>LigandoPets</title>
</head>
<body>
    <div id="sidebar-container"></div>
    <main>
        <div id="header-container"></div>
        <div class="paginas">
            <div class="paginas-head">
                <span class="mini-texto">Loja LigandoPets</span>
                <h2>Escolhas boas para o seu pet</h2>
                <p>Produtos selecionados</p>
            </div>
            <div class="filtro-loja">
                <button class="selecionado">Todos</button>
                <button>Cães</button>
                <button>Gatos</button>
                <button>Remédios</button>
                <button>Higiene</button>
            </div>
            <div class="grid-produtos">
                <article class="card-produto">
                    <div class="foto-produto">
                        <img src="../image/pet-food.png" alt="Foto ração cachorro">
                    </div>
                    <div class="informacao-produto">
                        <small>Cães adultos</small>
                        <h4>Ração</h4>
                        <div class="avaliacao">
                            <img src="../image/star.png" alt="Estrela amarela">
                            <b>4,2</b>
                            <span>
                                (67)
                            </span>
                        </div>
                        <div class="preco">
                            <b>R$ 89,90</b>
                            <button onclick="adicionarProduto()" class="botao-adicionar">
                                <img src="../image/plus.png" alt="Botão adicionar">
                            </button>
                        </div>
                    </div>
                </article>
                <article class="card-produto">
                    <div class="foto-produto">
                        <img src="../image/dog-toy.png" alt="Foto brinquedo cachorro">
                    </div>
                    <div class="informacao-produto">
                        <small>Cães filhotes</small>
                        <h4>Mordedor canino</h4>
                        <div class="avaliacao">
                            <img src="../image/star.png" alt="Estrela amarela">
                            <b>4,6</b>
                            <span>
                                (101)
                            </span>
                        </div>
                        <div class="preco">
                            <b>R$ 49,99</b>
                            <button onclick="adicionarProduto()" class="botao-adicionar">
                                <img src="../image/plus.png" alt="Botão adicionar">
                            </button>
                        </div>
                    </div>
                </article>
                <article class="card-produto">
                    <div class="foto-produto">
                        <img src="../image/cat-toy.png" alt="Foto brinquedo gato">
                    </div>
                    <div class="informacao-produto">
                        <small>Gatos filhotes</small>
                        <h4>Arranhador</h4>
                        <div class="avaliacao">
                            <img src="../image/star.png" alt="Estrela amarela">
                            <b>4,0</b>
                            <span>
                                (29)
                            </span>
                        </div>
                        <div class="preco">
                            <b>R$ 124,90</b>
                            <button onclick="adicionarProduto()" class="botao-adicionar">
                                <img src="../image/plus.png" alt="Botão adicionar">
                            </button>
                        </div>
                    </div>
                </article>
                <article class="card-produto">
                    <div class="foto-produto">
                        <img src="../image/medicine.png" alt="Foto remedio para pets">
                    </div>
                    <div class="informacao-produto">
                        <small>Cães e gatos</small>
                        <h4>Vermifugo</h4>
                        <div class="avaliacao">
                            <img src="../image/star.png" alt="Estrela amarela">
                            <b>5,0</b>
                            <span>
                                (1000)
                            </span>
                        </div>
                        <div class="preco">
                            <b>R$ 16,50</b>
                            <button onclick="adicionarProduto()" class="botao-adicionar">
                                <img src="../image/plus.png" alt="Botão adicionar">
                            </button>
                        </div>
                    </div>
                </article>
            </div>
        </div>
    </main>
    <script src="../script.js"></script>
    <script>
        carregarSidebar();
        carregarHeader();
    </script>
</body>
</html>
